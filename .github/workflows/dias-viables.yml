name: Datos históricos por día

on:
  workflow_dispatch: # se lanza a mano desde Actions → Run workflow
  schedule:
    - cron: "45 22 * * 1-5" # cada día de semana, 5:45 p.m. Bogotá

permissions:
  contents: write

jobs:
  dias:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python dias_viables.py --inicio 2026-03-01
      - name: Guardar tabla
        run: |
          git config user.name "reporte-bot"
          git config user.email "reporte-bot@users.noreply.github.com"
          git add data/dias_revision.xlsx data/dias_revision.csv
          git diff --cached --quiet || git commit -m "Datos históricos por día $(date -u +%F)"
          git push
