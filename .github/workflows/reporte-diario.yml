name: Reporte diario del oro

on:
  schedule:
    # Lunes a viernes 22:30 UTC (5:30 p.m. Bogotá), después del cierre de los futuros
    - cron: "30 22 * * 1-5"
  workflow_dispatch: # permite ejecutarlo a mano desde la pestaña Actions

permissions:
  contents: write

jobs:
  reporte:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python analisis_oro.py
      - name: Guardar reporte en el repositorio
        run: |
          git config user.name "reporte-bot"
          git config user.email "reporte-bot@users.noreply.github.com"
          git add reports
          git diff --cached --quiet || git commit -m "Reporte diario del oro $(date -u +%F)"
          git push
